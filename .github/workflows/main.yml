name: Build Seegha

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # create releases
  id-token: write        # build provenance attestation
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # lite: small exe, downloads the AI pack (45 MB) the first time AI upscaling is used
        # full: includes the AI pack, works fully offline
        variant: [lite, full]
    env:
      SEEGHA_EXE_NAME: ${{ matrix.variant == 'full' && 'Seegha-Full' || 'Seegha' }}
    steps:
      - uses: actions/checkout@v4

      # Python 3.8 is the last Python that runs on Windows 7.
      # Building with it gives one exe that also runs on 8.1 / 10 / 11 (64-bit).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x64

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Compiling PyInstaller's bootloader on the runner gives the exe a bootloader nobody else uses.
      # The prebuilt one is shared by thousands of programs (and malware), which is what makes
      # antivirus engines suspicious of PyInstaller apps. Falls back to the prebuilt wheel if compiling fails.
      - name: Install PyInstaller (own bootloader if possible)
        shell: pwsh
        run: |
          pip install --no-binary pyinstaller pyinstaller==5.13.2
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Bootloader compile failed - using the prebuilt PyInstaller wheel"
            pip install --force-reinstall pyinstaller==5.13.2
          } else {
            Write-Host "PyInstaller installed with a freshly compiled bootloader"
          }
          pyinstaller --version

      # Gyan "essentials" builds are the ones documented as Windows 7 compatible
      # (BtbN / "full" builds require Windows 10+).
      - name: Download ffmpeg 6.1.1 (essentials) and compress it with LZMA
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/6.1.1/ffmpeg-6.1.1-essentials_build.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName ffmpeg.exe
          .\ffmpeg.exe -version | Select-Object -First 1
          python tools\pack_ffmpeg.py ffmpeg.exe

      - name: Download Real-ESRGAN pack (full build only)
        if: matrix.variant == 'full'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip" -OutFile esrgan.zip
          Expand-Archive esrgan.zip -DestinationPath esrgan_tmp
          New-Item -ItemType Directory realesrgan | Out-Null
          Copy-Item esrgan_tmp\realesrgan-ncnn-vulkan.exe realesrgan\
          Copy-Item esrgan_tmp\vcomp140.dll realesrgan\
          Copy-Item -Recurse esrgan_tmp\models realesrgan\models
          if (-not (Test-Path realesrgan\models\realesrgan-x4plus.bin)) { throw "Real-ESRGAN models missing" }

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean seegha.spec
          Get-ChildItem dist | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      # Smoke test: runs the built exe in CLI mode (image, video, muted video).
      # continue-on-error: a failure here is shown in the log but does not block the download.
      - name: Smoke test the exe
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $app = "dist\$env:SEEGHA_EXE_NAME.exe"
          python -c "from PIL import Image; Image.new('RGB',(64,48),(200,30,30)).save('smoke.png')"
          .\ffmpeg.exe -y -loglevel error -f lavfi -i testsrc=duration=1:size=160x120:rate=10 -f lavfi -i sine=duration=1 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest smoke.mkv
          Start-Process -FilePath $app -ArgumentList "-t","jpg","smoke.png" -Wait
          if (-not (Test-Path smoke.jpg)) { throw "image conversion failed" }
          Start-Process -FilePath $app -ArgumentList "-t","mp4","--mute","smoke.mkv" -Wait
          if (-not (Test-Path smoke.mp4)) { throw "video conversion failed (bundled ffmpeg did not start?)" }
          $info = (& .\ffmpeg.exe -hide_banner -i smoke.mp4 2>&1 | Out-String)
          if ($info -match "Audio:") { throw "mute failed: audio stream still present" }
          Write-Host "Smoke test passed: image OK, video OK, muted video has no audio"
          exit 0

      - name: Checksum
        shell: pwsh
        run: Get-FileHash "dist\$env:SEEGHA_EXE_NAME.exe" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SEEGHA_EXE_NAME }}
          path: dist/${{ env.SEEGHA_EXE_NAME }}.exe

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}   # optional: add this repository secret to scan on VirusTotal
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist-all
          sha256sum *.exe | tee SHA256SUMS.txt

      # Signed, public proof that these exact files were built by this workflow from this repository.
      - name: Build provenance attestation
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-all/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-all/*.exe
            dist-all/SHA256SUMS.txt

      # Optional: scans the exes on VirusTotal and adds the report links to the release notes.
      - name: Scan on VirusTotal
        if: ${{ env.VT_API_KEY != '' }}
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          update_release_body: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist-all/*.exe
