name: Build Seegha

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional - type a NEW tag (e.g. v1.0.1) to also publish a GitHub release from this run"
        required: false
        default: ""

permissions:
  contents: write        # create releases
  id-token: write        # build provenance attestation
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # lite: small exe, downloads the AI pack (45 MB) the first time AI upscaling is used
        # full: includes the AI pack, works fully offline
        variant: [lite, full]
    env:
      SEEGHA_EXE_NAME: ${{ matrix.variant == 'full' && 'Seegha-Full' || 'Seegha' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Python 3.8 is the last Python that runs on Windows 7.
      # Building with it gives one exe that also runs on 8.1 / 10 / 11 (64-bit).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.8.10"
          architecture: x64

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Compiling PyInstaller's bootloader on the runner gives the exe a bootloader nobody else uses.
      # The prebuilt one is shared by thousands of programs (and malware), which is what makes
      # antivirus engines suspicious of PyInstaller apps. Falls back to the prebuilt wheel if compiling fails.
      - name: Install PyInstaller (own bootloader if possible)
        shell: pwsh
        run: |
          pip install --no-binary pyinstaller pyinstaller==5.13.2
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Bootloader compile failed - using the prebuilt PyInstaller wheel"
            pip install --force-reinstall pyinstaller==5.13.2
          } else {
            Write-Host "PyInstaller installed with a freshly compiled bootloader"
          }
          pyinstaller --version

      # Gyan "essentials" builds are the ones documented as Windows 7 compatible
      # (BtbN / "full" builds require Windows 10+).
      - name: Download ffmpeg 6.1.1 (essentials) and compress it with LZMA
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/6.1.1/ffmpeg-6.1.1-essentials_build.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName ffmpeg.exe
          .\ffmpeg.exe -version | Select-Object -First 1
          python tools\pack_ffmpeg.py ffmpeg.exe

      - name: Download Real-ESRGAN pack (full build only)
        if: matrix.variant == 'full'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip" -OutFile esrgan.zip
          Expand-Archive esrgan.zip -DestinationPath esrgan_tmp
          New-Item -ItemType Directory realesrgan | Out-Null
          Copy-Item esrgan_tmp\realesrgan-ncnn-vulkan.exe realesrgan\
          Copy-Item esrgan_tmp\vcomp140.dll realesrgan\
          Copy-Item -Recurse esrgan_tmp\models realesrgan\models
          if (-not (Test-Path realesrgan\models\realesrgan-x4plus.bin)) { throw "Real-ESRGAN models missing" }

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean seegha.spec
          Get-ChildItem dist | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      # Smoke test: runs the built exe in CLI mode (image, video, muted video).
      # continue-on-error: a failure here is shown in the log but does not block the download.
      - name: Smoke test the exe
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $app = "dist\$env:SEEGHA_EXE_NAME.exe"
          python -c "from PIL import Image; Image.new('RGB',(64,48),(200,30,30)).save('smoke.png')"
          .\ffmpeg.exe -y -loglevel error -f lavfi -i testsrc=duration=1:size=160x120:rate=10 -f lavfi -i sine=duration=1 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest smoke.mkv
          Start-Process -FilePath $app -ArgumentList "-t","jpg","smoke.png" -Wait
          if (-not (Test-Path smoke.jpg)) { throw "image conversion failed" }
          Start-Process -FilePath $app -ArgumentList "-t","mp4","--mute","smoke.mkv" -Wait
          if (-not (Test-Path smoke.mp4)) { throw "video conversion failed (bundled ffmpeg did not start?)" }
          $info = (& .\ffmpeg.exe -hide_banner -i smoke.mp4 2>&1 | Out-String)
          if ($info -match "Audio:") { throw "mute failed: audio stream still present" }
          Write-Host "Smoke test passed: image OK, video OK, muted video has no audio"
          exit 0

      - name: Checksum
        shell: pwsh
        run: Get-FileHash "dist\$env:SEEGHA_EXE_NAME.exe" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.SEEGHA_EXE_NAME }}
          path: dist/${{ env.SEEGHA_EXE_NAME }}.exe

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # a pushed tag (v1.0.x) or the tag typed into "Run workflow"
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      # GitHub "immutable releases": once a release is published its assets can never be changed or deleted,
      # and the tag name can never be reused. So re-running this job for a tag that is already published
      # would fail. Detect that and stop politely.
      - name: Is this tag already published?
        id: chk
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "::error::The release tag must look like v1.0.1 (got '$RELEASE_TAG')"; exit 1 ;;
          esac
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $RELEASE_TAG is already published and cannot be modified. Use a NEW tag (for example v1.0.1) to make another release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.chk.outputs.published != 'true'
        with:
          path: dist-all
          merge-multiple: true

      - name: Checksums and release notes
        if: steps.chk.outputs.published != 'true'
        run: |
          cd dist-all
          sha256sum *.exe | tee SHA256SUMS.txt
          {
            echo "## Seegha $RELEASE_TAG"
            echo
            echo "| File | SHA-256 | VirusTotal |"
            echo "|---|---|---|"
            while read -r hash name; do
              echo "| \`$name\` | \`$hash\` | [report](https://www.virustotal.com/gui/file/$hash) |"
            done < <(sha256sum *.exe)
            echo
            echo "**Seegha.exe** (lite) downloads the 45 MB AI pack the first time AI upscaling is used. **Seegha-Full.exe** includes it (works offline)."
            echo
            echo "Verify your download: compare the SHA-256 above with \`SHA256SUMS.txt\`, or run \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            echo "The VirusTotal link shows a report once the file has been scanned there."
            echo
            echo "---"
            echo
            echo "**Seegha (صيغة)** محوّل صور وفيديو وصوت مجاني. **Seegha.exe** النسخة الخفيفة، و**Seegha-Full.exe** تحتوي حزمة رفع الجودة وتشتغل بدون إنترنت."
          } > ../notes.md
          cat ../notes.md

      # Signed, public proof that these exact files were built by this workflow from this repository.
      - name: Build provenance attestation
        if: steps.chk.outputs.published != 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist-all/*.exe

      # Draft first: assets can only be attached while a release is still a draft (immutable-release rule).
      # Uses the GitHub CLI that is preinstalled on the runner, so no third-party action is needed.
      - name: Create draft release and attach files
        if: steps.chk.outputs.published != 'true'
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Removing a leftover draft release for $RELEASE_TAG"
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "Seegha $RELEASE_TAG" --notes-file notes.md \
            dist-all/*.exe dist-all/SHA256SUMS.txt

      - name: Publish the release
        if: steps.chk.outputs.published != 'true'
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
